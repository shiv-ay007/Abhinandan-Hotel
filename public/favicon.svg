<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
  </defs>

  <!-- Luxury rounded square badge background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#D97706" stroke-width="2" />

  <!-- Crown / Stars motif -->
  <g fill="#FBBF24">
    <!-- Center star -->
    <polygon points="32,10 33.5,14 37.5,14.5 34.5,17 35.5,21 32,18.5 28.5,21 29.5,17 26.5,14.5 30.5,14" />
    <!-- Small left star -->
    <circle cx="21" cy="15" r="1.5" />
    <!-- Small right star -->
    <circle cx="43" cy="15" r="1.5" />
  </g>

  <!-- Elegant 'A' Monogram for Abhinandan -->
  <text x="32" y="48" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">
    A
  </text>

  <!-- Small horizontal accent bar -->
  <line x1="22" y1="53" x2="42" y2="53" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
</svg>